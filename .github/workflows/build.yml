name: Build

# Executables for Linux and Windows plus the wheel, each smoke-tested. Called by
# CI (pull requests and pushes) and by Release, which attaches the files to the
# GitHub release.
on:
  workflow_call:
    inputs:
      release:
        description: Name the files by the version alone (no commit)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: the Linux binary needs at least its glibc (2.35).
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: cypilot
          - os: windows-2022
            platform: windows-x86_64
            exe: cypilot.exe
    runs-on: ${{ matrix.os }}
    env:
      # The DSDL download asks the GitHub API for the cymon-lib commit of the UNIMOC release.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . "pyinstaller>=6.10,<7"
      - name: Build
        run: pyinstaller --noconfirm packaging/cypilot.spec
      - name: Smoke test (the DSDL download, a demo device, a run)
        run: python packaging/smoke_test.py dist/${{ matrix.exe }}
      - name: Name by version and platform
        id: name
        shell: bash
        run: |
          version=$(python -c "import cypilot; print(cypilot.__version__)")
          if [[ "${{ inputs.release }}" != "true" ]]; then version="${version}-g$(git rev-parse --short HEAD)"; fi
          ext="${{ matrix.exe }}"; ext="${ext#cypilot}"
          file="cypilot-${version}-${{ matrix.platform }}${ext}"
          mv "dist/${{ matrix.exe }}" "dist/${file}"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cypilot-${{ matrix.platform }}
          path: dist/${{ steps.name.outputs.file }}
          if-no-files-found: error

  wheel:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the oldest supported Python, as on the Pi
      - name: Build the wheel
        run: pip wheel . --no-deps -w dist
      - name: Smoke test the wheel outside the source tree
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cp packaging/smoke_test.py /tmp/
          cd /tmp && /tmp/wheel-venv/bin/python smoke_test.py /tmp/wheel-venv/bin/cypilot-ctl
      - uses: actions/upload-artifact@v4
        with:
          name: cypilot-wheel
          path: dist/*.whl
          if-no-files-found: error
