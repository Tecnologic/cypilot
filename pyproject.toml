[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cypilot"
version = "0.1.0.dev0"
description = "Operator web app and CLI for UNIMOC drives and other Cyphal nodes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tecnologic" }]
keywords = ["cyphal", "uavcan", "can", "motor-control", "unimoc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pycyphal[transport-can-pythoncan,transport-udp]~=1.27",
    "pyserial~=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy~=2.4",
    "playwright>=1.44",
    "pytest~=9.1",
    "ruff==0.17.2",
]

[project.scripts]
cypilot-ctl = "cypilot.cli:main"
cypilot = "cypilot.cli:app_main"

# python-can plugin: the interface "canable" (CANable 2.0 slcan firmware in CAN FD mode).
[project.entry-points."can.interface"]
canable = "cypilot.core.canable:CanableBus"

[project.urls]
Repository = "https://github.com/Tecnologic/cypilot"
Firmware = "https://github.com/Tecnologic/unimoc"

[tool.hatch.build.targets.wheel]
packages = ["src/cypilot"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request bodies with Body() defaults.
"src/cypilot/web/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/cypilot"]
strict = true
# The DSDL packages (uavcan, reg, unimoc, cymon) are generated at run time.
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pycyphal.*", "can.*", "serial.*", "uvicorn.*", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: needs the UNIMOC native_sim binary (Linux), see tests/sim/conftest.py",
    "browser: needs Chromium for Playwright, see the browser fixture in tests/conftest.py",
]
